name: Daily scout pipeline

# Pulls free public topics (Google News RSS + Hacker News API) every morning
# and rebuilds content briefs. No API keys, no secrets.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scout topics
        run: python3 scout.py

      - name: Build briefs
        run: python3 brief.py

      - name: Record health
        run: |
          python3 - <<'EOF'
          import json, datetime, os
          p = "data/health.json"
          h = json.load(open(p)) if os.path.exists(p) else {}
          h["successful_runs"] = h.get("successful_runs", 0) + 1
          h["last_run"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          json.dump(h, open(p, "w"), indent=1)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add data/trends.json data/briefs.json data/health.json
          git diff --cached --quiet || git commit -m "Daily scout: $(date -u +%Y-%m-%d)"
          git push
